[workspace]
# Do not publish to crates.io; releases are GitHub releases with pre-built binaries only.
publish = false
# Packaged semver baselines resolve internal dependencies (such as common) from
# crates.io, where we don't publish them. Use commit messages for version bumps.
semver_check = false

[[package]]
name = "common"
# common is an internal library. Don't create a GitHub release or tag for it,
# but release-plz still tracks its version so changes propagate to dependents.
git_release_enable = false
git_tag_enable = false

[[package]]
name = "csm-server"

[[package]]
name = "csm-reporter"
git_only = true

[[package]]
name = "csm-watcher"
git_only = true

[[package]]
name = "csm-tui"
git_only = true
